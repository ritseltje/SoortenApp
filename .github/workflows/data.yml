name: Update species data
on:
  workflow_dispatch:
    inputs:
      quick:
        description: Small test run
        type: boolean
        default: false
  schedule:
    - cron: '17 3 1 * *' # monthly
  push:
    paths: [scripts/build-data.mjs, .github/workflows/data.yml]
permissions:
  contents: write
concurrency:
  group: data-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data
        env:
          QUICK: ${{ inputs.quick && '1' || '' }}
        run: |
          set -o pipefail
          node scripts/build-data.mjs 2>&1 | tee build-log.txt
      - name: Commit data
        if: always()
        run: |
          mkdir -p public/data && mv build-log.txt public/data/build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Update species data"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
