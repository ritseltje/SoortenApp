name: probe
on:
  push:
    branches: [claude/soorten-app]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          exec > probe-out.txt 2>&1
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          V=https://www.verspreidingsatlas.nl
          curl -sL -A "$UA" "$V/" | grep -oiE '<a class="rsmLink" href="[^"]*">[^<]*' | sort -u
          for g in reptielen vaatplanten zoogdieren vogels bijen kevers mieren spinnen; do
            echo "== $g"; curl -sL -A "$UA" "$V/soortenlijst/$g" -o g.html -w "%{http_code} %{url_effective} %{size_download}\n"
            grep -oiE '<a [^>]*href="[^"]*"[^>]*>[^<]{2,60}</a>' g.html | grep -viE 'rsmLink|login|privacy' | head -12
          done
          curl -sL -A "$UA" "$V/mobiel/soortenlijst.aspx?soortgroep=R" -o m.html; grep -oiE '<a [^>]*href="[^"]*"[^>]*>[^<]{2,60}</a>' m.html | head -12; grep -oiE "(href|onclick)=\"[^\"]*\"" m.html | sort -u | head -30
      - name: publish output
        if: always()
        run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-output
          git rm -rfq --cached . ; git add probe-out.txt; git commit -qm probe
          git push -f origin probe-output
