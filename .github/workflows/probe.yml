name: probe
on:
  push:
    branches: [claude/soorten-app]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          exec > probe-out.txt 2>&1
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          V=https://www.verspreidingsatlas.nl
          curl -sL -A "$UA" "$V/soortenlijst/reptielen" -o g.html
          python3 - <<'PY'
          import re
          h=open('g.html',encoding='utf-8',errors='replace').read()
          i=h.find('HNSgridview'); rows=re.findall(r'<tr.*?</tr>',h[i:],re.S)
          for r in rows[:4]: print(r[:1500]); print('-----')
          PY
          for u in "$V/9705453" "$V/1" "$V/0"; do curl -sL -A "$UA" -o x.html "$u"; echo "$u"; grep -oE '<(title|h1|h2)[^>]*>[^<]*' x.html | head -5; done
      - name: publish output
        if: always()
        run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-output
          git rm -rfq --cached . ; git add probe-out.txt; git commit -qm probe
          git push -f origin probe-output
